services:
  db:
    image: postgres:17
    container_name: acmak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acmak_inventory
      POSTGRES_USER: acmak_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acmak_user -d acmak_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: